services:
  - type: web
    name: sahaaya-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DATABASE_URL
        fromDatabase:
          name: sahaaya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_USER_EMAIL
        value: sumith@sahaaya.demo
      - key: DEMO_USER_NAME
        value: Sumith Choudhary
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_VIEWER_PASSWORD
        sync: false
      - key: SAHAAYA_INGESTION_ENABLED
        value: "false"

databases:
  - name: sahaaya-db
    databaseName: sahaaya
    user: sahaaya
    plan: free
